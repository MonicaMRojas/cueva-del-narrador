<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · La Cueva del Narrador</title>
<meta name="theme-color" content="#528A93">
<meta name="robots" content="noindex">
<script>
// Las páginas interiores se movieron a la carpeta paginas/: los enlaces antiguos se redirigen solos.
(function(){
  var ANTIGUAS=['calendario','curso','biblioteca','mas','retos','club','entidades','contacto','instalar','privacidad'];
  var m=location.pathname.match(/^(.*\/)([a-z]+)\.html$/);
  if(m&&m[1].indexOf('/paginas/')<0&&ANTIGUAS.indexOf(m[2])>=0) location.replace(m[1]+'paginas/'+m[2]+'.html'+location.search+location.hash);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2F5860;color:#EBEDEF;font-family:Georgia,serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-family:'Arial Narrow',Impact,sans-serif;text-transform:uppercase;color:#FFBA55;font-size:36px;margin:0 0 12px}
p{margin:0 0 20px;line-height:1.55}
a{display:inline-block;background:#FFBA55;color:#2F5860;border-radius:999px;padding:12px 24px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Aquí no hay nada</h1>
  <p>Esta página no existe o ha cambiado de sitio.</p>
  <a id="inicio" href="/">Volver al inicio</a>
</main>
<script>
// En GitHub Pages la app vive en una subcarpeta con el nombre del repositorio
if(/\.github\.io$/.test(location.hostname)) document.getElementById('inicio').href='/'+location.pathname.split('/')[1]+'/';
</script>
</body>
</html>
