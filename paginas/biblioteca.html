<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca · La Cueva del Narrador</title>
<meta name="theme-color" content="#528A93">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app">
  <header class="pagehead">
    <div class="top">
      <div class="brand">
        <img src="../img/logo-arco.png" alt="Logo de La Cueva del Narrador">
        <span>La Cueva<br>del Narrador</span>
      </div>
      <div class="avatar" aria-label="Tu perfil">M</div>
    </div>
    <h1>Biblioteca</h1>
    <p class="sub">Los libros del club y las lecturas que nos recomendamos.</p>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-biblioteca" aria-selected="true">Nuestra biblioteca</button>
      <button class="tab" role="tab" id="tab-recomendados" aria-selected="false">Recomendados</button>
    </div>

    <section aria-label="Filtros">
      <input class="buscador" id="q" type="search" placeholder="Buscar por título o autor" aria-label="Buscar por título o autor">
      <div class="chips" id="generos" aria-label="Filtrar por género"></div>
      <label class="solo" id="solo-wrap"><input type="checkbox" id="solo"> Solo libros disponibles</label>
    </section>

    <section aria-live="polite">
      <p class="cuenta" id="cuenta"></p>
      <div id="lista"></div>
    </section>
  </main>

  <nav class="nav" id="nav" data-actual="biblioteca" aria-label="Navegación principal"></nav>
</div>
<script src="../js/comun.js"></script>
<script src="../js/tipos.js"></script>
<script src="../datos/libros.js"></script>
<script src="../js/paginas/biblioteca.js"></script>
</body>
</html>
